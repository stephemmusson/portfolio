name: Build MussMarter Archive (preview only)
on:
  push:
    branches: [mussmarter-archive]
    paths:
      - 'mussmarter/import_public_site.py'
      - '.github/workflows/mussmarter-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect full stories and original images
        run: python mussmarter/import_public_site.py
      - name: Validate archive and split into smaller downloads
        run: |
          python - <<'PY'
          import json, shutil, zipfile
          from pathlib import Path
          p=Path("mussmarter/site")
          report=json.loads((p/"migration-report.json").read_text())
          print("Stories:",report["post_count"],"Photos:",report["downloaded_images"],"Failures:",len(report["failures"]))
          if report["post_count"]<1 or report["downloaded_images"]<1:
              raise SystemExit("Incomplete import: no posts or images")
          chunks=Path("mussmarter/split-downloads")
          chunks.mkdir(exist_ok=True)
          # Text-only ZIP includes ALL full story pages, report, CSS and homepage.
          with zipfile.ZipFile(chunks/"mussmarter-stories-and-website.zip","w",zipfile.ZIP_DEFLATED) as z:
              for f in p.rglob("*"):
                  if f.is_file() and "assets" not in f.relative_to(p).parts:
                      z.write(f, f.relative_to(p))
          images=sorted(f for f in (p/"assets").rglob("*") if f.is_file())
          limit=20*1024*1024
          part=0
          current_size=0
          z=None
          for f in images:
              if z is None or (current_size+f.stat().st_size>limit and current_size>0):
                  if z is not None:z.close()
                  part+=1
                  z=zipfile.ZipFile(chunks/f"mussmarter-photos-{part:02d}.zip","w",zipfile.ZIP_STORED)
                  current_size=0
              z.write(f, f.relative_to(p))
              current_size+=f.stat().st_size
          if z is not None:z.close()
          print("Photo packages:",part,"(about 20 MB maximum each)")
          if part>30:
              raise SystemExit("More than 30 photo packages; update workflow to upload remaining parts")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mussmarter-stories-and-website
          path: mussmarter/split-downloads/mussmarter-stories-and-website.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mussmarter-photos-01
          path: mussmarter/split-downloads/mussmarter-photos-01.zip
          if-no-files-found: ignore
