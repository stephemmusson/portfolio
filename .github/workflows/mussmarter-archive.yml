name: Build MussMarter Archive (preview only)
on:
  push:
    branches: [mussmarter-archive]
    paths:
      - 'mussmarter/import_public_site.py'
      - '.github/workflows/mussmarter-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Collect stories and images from original site
        run: python mussmarter/import_public_site.py
      - name: Validate archive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("mussmarter/site/migration-report.json")
          report=json.loads(p.read_text())
          print("Stories:",report["post_count"],"Photos:",report["downloaded_images"],"Failures:",len(report["failures"]))
          if report["post_count"]<1:raise SystemExit("Nothing archived")
          if report["downloaded_images"]<1:raise SystemExit("No images archived")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mussmarter-site-preview
          path: mussmarter/site/
          if-no-files-found: warn
          retention-days: 30
